# netlify.toml — place in repo root (same level as index.html)
# PRC Impact static site

[build]
  publish = "."

# ---------------------------------------------------------------
# 1. Force the Netlify preview subdomain to the real domain.
#    Stops golden-elf-52cfd6.netlify.app from being crawled and
#    indexed as a duplicate copy of the site.
# ---------------------------------------------------------------
[[redirects]]
  from = "https://golden-elf-52cfd6.netlify.app/*"
  to = "https://prcimpact.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------
# 2. Legacy URL cleanup — old Wix-era paths.
#    Add or remove lines here as you confirm which old URLs
#    still receive traffic (check Search Console once verified).
# ---------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/research-services"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/research-services"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/our-work"
  to = "/work"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/work"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301


# ---------------------------------------------------------------
# 2b. Canonical URL enforcement — one address per page.
#    Netlify serves every page at both /page and /page.html and
#    neither redirected, so Google indexed both copies and split
#    the ranking signal. These 301s collapse them onto the clean
#    URL, which is what the sitemap, canonicals and internal
#    links now all point to.
# ---------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/research-services.html"
  to = "/research-services"
  status = 301
  force = true

[[redirects]]
  from = "/speaking-briefings.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/speaking-briefings"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you"
  status = 301
  force = true

[[redirects]]
  from = "/who-we-center.html"
  to = "/who-we-center"
  status = 301
  force = true

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/work/birmingham-violence-prevention.html"
  to = "/work/birmingham-violence-prevention"
  status = 301
  force = true

[[redirects]]
  from = "/work/montgomery-public-schools.html"
  to = "/work/montgomery-public-schools"
  status = 301
  force = true

[[redirects]]
  from = "/work/prescriber-comprehension.html"
  to = "/work/prescriber-comprehension"
  status = 301
  force = true

# ---------------------------------------------------------------
# 3. Security headers.
#    Public-sector and enterprise procurement teams run automated
#    scans on vendor sites. These are table stakes and currently
#    absent from every response.
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Revalidate page responses so new HTML is not paired with old CSS.
    Cache-Control = "public, max-age=0, must-revalidate"
    # CSP widened to allow the embedded CRM contact form widget.
    # Requires 'unsafe-eval': the widget builds the form via eval at runtime.
    # Without it the script loads, the API returns 200, and the form silently
    # never renders. Allowed hosts: cdnstyles.com (widget script),
    # apigateway.co (form API),
    # Google reCAPTCHA + Fonts + Maps/Places (loaded by the widget).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.cdnstyles.com https://www.google.com https://www.gstatic.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.cdnstyles.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.cdnstyles.com https://www.google.com https://www.gstatic.com https://maps.gstatic.com; connect-src 'self' https://forms-prod.apigateway.co https://places.googleapis.com https://maps.googleapis.com https://www.googleapis.com; frame-src https://www.google.com https://www.cdnstyles.com; form-action 'self' https://forms-prod.apigateway.co; frame-ancestors 'self'; base-uri 'self'"

# ---------------------------------------------------------------
# 4. Caching.
#    The site is actively changing. Revalidate shared CSS and assets
#    so returning visitors do not see new HTML with an older design.
#    Netlify and browsers can still use conditional requests and 304s.
# ---------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML stays uncached so copy edits go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

